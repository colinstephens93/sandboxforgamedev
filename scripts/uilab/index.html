<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>UI lab</title>
<style>
  html,body{margin:0;height:100%;background:radial-gradient(ellipse at 40% 30%,#5a6068,#2a2e33 70%);overflow:hidden;font-family:system-ui,Segoe UI,Roboto,sans-serif;color:#e8e8e8}
  .panel{position:fixed;z-index:20;background:rgba(14,15,18,.96);border:1px solid #3a3d44;border-radius:6px;color:#e6e6e6;pointer-events:auto;font-size:13px}
  .panel h3{margin:0 0 8px;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:#d9a441}
  .panel button{background:#23262c;color:#e6e6e6;border:1px solid #3d414a;border-radius:3px;padding:6px 10px;cursor:pointer;font:inherit}
  .panel button:hover{background:#2d3139} .panel button:disabled{opacity:.4;cursor:default}
  .panel button.primary{background:#7a5a1c;border-color:#d9a441}
  .ui-hud{position:fixed;inset:0;pointer-events:none;font-size:14px}
  .ui-msg{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);max-width:760px;padding:10px 16px;background:rgba(10,10,12,.82);border:1px solid #4a4d55;border-radius:4px;opacity:0;transition:opacity .3s;text-align:center;line-height:1.4}
  .ui-cross,.ui-prompt,.ui-label,.ui-fps,.ui-help{display:none}
</style></head>
<body><div id="ui"></div><script type="module" src="./lab.js"></script></body></html>
